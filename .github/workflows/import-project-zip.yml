
name: Import project ZIP

on:
  push:
    paths:
      - "incoming/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: extract
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          incoming = Path("incoming")
          archives = sorted(incoming.glob("*.zip"))

          if not archives:
              print("No ZIP file found in incoming/")
              raise SystemExit(0)

          archive = archives[-1]

          with ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]

              # Strip a single enclosing folder if the ZIP has one.
              parts = [Path(i.filename).parts for i in entries]
              roots = {p[0] for p in parts if p}

              strip_root = (
                  len(roots) == 1
                  and all(len(p) > 1 for p in parts if p)
              )

              for item in entries:
                  p = Path(item.filename)

                  if p.is_absolute() or ".." in p.parts:
                      raise ValueError(f"Unsafe ZIP path: {item.filename}")

                  if item.external_attr >> 28 == 0xA:
                      raise ValueError(f"Symlink not allowed: {item.filename}")

                  if strip_root:
                      p = Path(*p.parts[1:])

                  if not p.parts or p.parts[0] in {".git", ".github"}:
                      continue

                  destination = Path(".") / p
                  destination.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(item) as source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)

          archive.unlink()
          print(f"Imported {archive.name} into repository root")
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import project files from ZIP"
            git push
          else
            echo "No changes to commit."
          fi
